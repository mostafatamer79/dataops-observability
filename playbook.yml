# ============================================================
# DataOps Observability & Data Pipeline - Ansible Playbook
# Configures all EC2 instances with monitoring and logging stack
# ============================================================

---
- name: Configure Worker Nodes (node_exporter only)
  hosts: workers
  become: yes
  vars:
    node_exporter_version: "1.8.1"
    cribl_cloud_url: "https://main-lucid-hayes-xbe6kv7.cribl.cloud"
    cribl_token: "{{ lookup('env', 'CRIBL_TOKEN') }}"

  tasks:
    # ==========================================================
    # Common Setup
    # ==========================================================
    - name: Update system packages
      yum:
        name: "*"
        state: latest
        update_only: yes
      tags: [common]

    - name: Install required packages
      yum:
        name:
          - tar
          - gzip
        state: present
      tags: [common]

    # ==========================================================
    # node_exporter Installation
    # ==========================================================
    - name: Download node_exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter.tar.gz"
        mode: '0644'
      tags: [node_exporter]

    - name: Extract node_exporter
      unarchive:
        src: "/tmp/node_exporter.tar.gz"
        dest: "/tmp"
        remote_src: yes
      tags: [node_exporter]

    - name: Move node_exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "/usr/local/bin/node_exporter"
        mode: '0755'
        remote_src: yes
      tags: [node_exporter]

    - name: Create node_exporter user
      user:
        name: node_exporter
        system: yes
        shell: /bin/false
        create_home: no
      tags: [node_exporter]

    - name: Create node_exporter systemd service
      copy:
        dest: "/etc/systemd/system/node_exporter.service"
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter
          Restart=always

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      tags: [node_exporter]

    - name: Start and enable node_exporter
      systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes
      tags: [node_exporter]

    - name: Verify node_exporter is running
      uri:
        url: "http://localhost:9100/metrics"
        method: GET
        status_code: 200
      register: node_exporter_check
      retries: 5
      delay: 2
      until: node_exporter_check.status == 200
      tags: [node_exporter]

    # ==========================================================
    # Cribl Edge Installation
    # ==========================================================
    - name: Install Cribl Edge
      shell: |
        curl -s '{{ cribl_cloud_url }}/init/install-edge.sh?group=default_fleet&token={{ cribl_token }}&user=cribl&user_group=cribl&install_dir=%2Fopt%2Fcribl' | bash
      args:
        creates: /opt/cribl/bin/cribl
      failed_when: false
      tags: [cribl]

    - name: Ensure Cribl Edge is running
      systemd:
        name: cribl-edge
        state: started
        enabled: yes
        daemon_reload: yes
      tags: [cribl]

    - name: Wait for Cribl Edge to be ready
      uri:
        url: "http://localhost:9420"
        method: GET
        status_code: 200
      register: cribl_check
      retries: 10
      delay: 5
      until: cribl_check.status == 200
      tags: [cribl]

- name: Configure Monitoring Server (Prometheus + Grafana + node_exporter + Cribl)
  hosts: monitoring
  become: yes
  vars:
    node_exporter_version: "1.8.1"
    prometheus_version: "2.53.0"
    grafana_version: "11.0.0"
    cribl_cloud_url: "https://main-lucid-hayes-xbe6kv7.cribl.cloud"
    cribl_token: "{{ lookup('env', 'CRIBL_TOKEN') }}"
    grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"
    worker_1_ip: "10.0.1.11"
    worker_2_ip: "10.0.1.12"

  tasks:
    # ==========================================================
    # Common Setup
    # ==========================================================
    - name: Update system packages
      yum:
        name: "*"
        state: latest
        update_only: yes
      tags: [common]

    - name: Install required packages
      yum:
        name:
          - tar
          - gzip
          - fontconfig
          - freetype
        state: present
      tags: [common]

    # ==========================================================
    # node_exporter Installation
    # ==========================================================
    - name: Download node_exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter.tar.gz"
        mode: '0644'
      tags: [node_exporter]

    - name: Extract node_exporter
      unarchive:
        src: "/tmp/node_exporter.tar.gz"
        dest: "/tmp"
        remote_src: yes
      tags: [node_exporter]

    - name: Move node_exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "/usr/local/bin/node_exporter"
        mode: '0755'
        remote_src: yes
      tags: [node_exporter]

    - name: Create node_exporter user
      user:
        name: node_exporter
        system: yes
        shell: /bin/false
        create_home: no
      tags: [node_exporter]

    - name: Create node_exporter systemd service
      copy:
        dest: "/etc/systemd/system/node_exporter.service"
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter
          Restart=always

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      tags: [node_exporter]

    - name: Start and enable node_exporter
      systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes
      tags: [node_exporter]

    # ==========================================================
    # Prometheus Installation
    # ==========================================================
    - name: Download Prometheus
      get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: "/tmp/prometheus.tar.gz"
        mode: '0644'
      tags: [prometheus]

    - name: Extract Prometheus
      unarchive:
        src: "/tmp/prometheus.tar.gz"
        dest: "/tmp"
        remote_src: yes
      tags: [prometheus]

    - name: Move Prometheus to /opt
      copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/"
        dest: "/opt/prometheus"
        mode: '0755'
        remote_src: yes
      tags: [prometheus]

    - name: Create prometheus user
      user:
        name: prometheus
        system: yes
        shell: /bin/false
        create_home: no
      tags: [prometheus]

    - name: Set Prometheus permissions
      file:
        path: "/opt/prometheus"
        owner: prometheus
        group: prometheus
        recurse: yes
      tags: [prometheus]

    - name: Create Prometheus configuration
      copy:
        dest: "/opt/prometheus/prometheus.yml"
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          scrape_configs:
            - job_name: 'node'
              static_configs:
                - targets:
                  - 'localhost:9100'
                  - '{{ worker_1_ip }}:9100'
                  - '{{ worker_2_ip }}:9100'
        mode: '0644'
        owner: prometheus
        group: prometheus
      tags: [prometheus]

    - name: Create Prometheus systemd service
      copy:
        dest: "/etc/systemd/system/prometheus.service"
        content: |
          [Unit]
          Description=Prometheus
          After=network.target

          [Service]
          User=prometheus
          ExecStart=/opt/prometheus/prometheus --config.file=/opt/prometheus/prometheus.yml
          Restart=always
          WorkingDirectory=/opt/prometheus

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      tags: [prometheus]

    - name: Start and enable Prometheus
      systemd:
        name: prometheus
        state: started
        enabled: yes
        daemon_reload: yes
      tags: [prometheus]

    - name: Verify Prometheus is running
      uri:
        url: "http://localhost:9090/api/v1/targets"
        method: GET
        status_code: 200
      register: prometheus_check
      retries: 10
      delay: 3
      until: prometheus_check.status == 200
      tags: [prometheus]

    # ==========================================================
    # Grafana Installation
    # ==========================================================
    - name: Add Grafana YUM repository
      copy:
        dest: "/etc/yum.repos.d/grafana.repo"
        content: |
          [grafana]
          name=grafana
          baseurl=https://packages.grafana.com/oss/rpm
          repo_gpgcheck=1
          enabled=1
          gpgcheck=1
          gpgkey=https://packages.grafana.com/gpg.key
          sslverify=1
          sslcacert=/etc/pki/tls/certs/ca-bundle.crt
        mode: '0644'
      tags: [grafana]

    - name: Install Grafana
      yum:
        name: grafana
        state: present
      tags: [grafana]

    - name: Start and enable Grafana
      systemd:
        name: grafana-server
        state: started
        enabled: yes
        daemon_reload: yes
      tags: [grafana]

    - name: Wait for Grafana to be ready
      uri:
        url: "http://localhost:3000/api/health"
        method: GET
        status_code: 200
      register: grafana_check
      retries: 15
      delay: 5
      until: grafana_check.status == 200
      tags: [grafana]

    - name: Change Grafana admin password
      uri:
        url: "http://localhost:3000/api/user/password"
        method: PUT
        user: admin
        password: admin
        body_format: json
        body:
          oldPassword: "admin"
          newPassword: "{{ grafana_admin_password }}"
        status_code: 200
      tags: [grafana]

    - name: Add Prometheus datasource to Grafana
      uri:
        url: "http://localhost:3000/api/datasources"
        method: POST
        user: admin
        password: "{{ grafana_admin_password }}"
        body_format: json
        body:
          name: "Prometheus"
          type: "prometheus"
          url: "http://localhost:9090"
          access: "proxy"
          isDefault: true
        status_code: 200
      tags: [grafana]

    - name: Import Node Exporter dashboard
      uri:
        url: "http://localhost:3000/api/dashboards/db"
        method: POST
        user: admin
        password: "{{ grafana_admin_password }}"
        body_format: json
        body:
          dashboard:
            id: null
            uid: null
            title: "Node Exporter Full"
            tags: ["prometheus"]
            timezone: "browser"
            schemaVersion: 16
            version: 0
          folderId: 0
          overwrite: false
        status_code: 200
      tags: [grafana]

    # ==========================================================
    # Cribl Edge Installation
    # ==========================================================
    - name: Install Cribl Edge
      shell: |
        curl -s '{{ cribl_cloud_url }}/init/install-edge.sh?group=default_fleet&token={{ cribl_token }}&user=cribl&user_group=cribl&install_dir=%2Fopt%2Fcribl' | bash
      args:
        creates: /opt/cribl/bin/cribl
      failed_when: false
      tags: [cribl]

    - name: Ensure Cribl Edge is running
      systemd:
        name: cribl-edge
        state: started
        enabled: yes
        daemon_reload: yes
      tags: [cribl]

    - name: Wait for Cribl Edge to be ready
      uri:
        url: "http://localhost:9420"
        method: GET
        status_code: 200
      register: cribl_check
      retries: 10
      delay: 5
      until: cribl_check.status == 200
      tags: [cribl]

    # ==========================================================
    # Verification
    # ==========================================================
    - name: Print service status
      debug:
        msg:
          - "=== DataOps Monitoring Server Setup Complete ==="
          - "node_exporter: http://localhost:9100/metrics"
          - "Prometheus: http://localhost:9090"
          - "Grafana: http://localhost:3000"
          - "Cribl Edge: http://localhost:9420"
          - "Grafana admin password is supplied through GRAFANA_ADMIN_PASSWORD"
      tags: [verify]
